name: Build and Deploy

on:
  push:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.rodydavis.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Site
        run: pnpm run build --base=/rodydavis/lit-examples/

      - name: Deploy Static Pages
        if: github.event_name != 'pull_request'
        uses: https://git.rodydavis.dev/rodydavis/shared-actions/pages-deploy@main
        with:
          path: './dist'
          domain: 'lit-examples.rodydavis.dev'
          git_token: ${{ secrets.GIT_TOKEN }}
          ssh_key: ${{ secrets.TRUENAS_SSH_KEY }}
